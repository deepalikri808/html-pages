<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeeksforGeeks Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-container {
            width: 90%;
            max-width: 675px;
            background-color: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #4caf50;
            font-size: 38px;
            margin: 20px 0 35px;
        }

        h2 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #555;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 22px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #4caf50;
        }

        button {
            width: 100%;
            padding: 17px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #43a047;
        }

        .register-link {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .register-link a {
            color: #79528f;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 30px;
            }

            h2 {
                font-size: 20px;
            }

            .login-container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>GeeksforGeeks</h1>

        <h2>Enter your login credentials</h2>

        <form action="#" method="post">

            <label for="username">Username:</label>
            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your Username"
                required
            >

            <label for="password">Password:</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your Password"
                required
            >

            <button type="submit">Submit</button>

        </form>

        <div class="register-link">
            Not registered?
            <a href="register.html">Create an account</a>
        </div>

    </div>

</body>
</html>
